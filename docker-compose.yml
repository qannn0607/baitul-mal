services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: baitul_mal_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - baitul_mal_net

  web:
    image: nginx:alpine
    container_name: baitul_mal_web
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - baitul_mal_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: baitul_mal_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: baitul_mal
      MYSQL_USER: baitul_mal
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - baitul_mal_dbdata:/var/lib/mysql
    networks:
      - baitul_mal_net

networks:
  baitul_mal_net:
    driver: bridge

volumes:
  baitul_mal_dbdata:
    driver: local
